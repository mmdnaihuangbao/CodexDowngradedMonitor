name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.3.0 或 v0.3.0'
        required: true
        type: string
      changes:
        description: '本次发布的变更内容；留空则自动汇总上个标签以来的提交'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Windows amd64 package
    runs-on: windows-2022
    env:
      # 强制 Python 全 UTF-8 输出，否则 runner 默认 cp1252 会因打印中文抛 UnicodeEncodeError
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          # 需要完整历史与全部标签，用于汇总上个标签以来的提交
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository configuration
        run: python -m json.tool config.json > $null

      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build native collector and run native tests
        run: .\cpp_collector\tests\run.ps1

      - name: Run service self-test
        run: python .\_selftest.py

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANGES: ${{ inputs.changes }}
          TAG_REF: ${{ github.ref_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION.Trim()
            $manualChanges = $env:INPUT_CHANGES.Trim()
          }
          else {
            $tag = $env:TAG_REF.Trim()
            if ($tag.StartsWith('v')) { $version = $tag.Substring(1) } else { $version = $tag }
            $manualChanges = ''
          }

          if ($manualChanges) {
            $changes = $manualChanges
          }
          else {
            # 找当前提交父提交上最近的标签，即"上一个版本"的标签
            $prev = $null
            git describe --tags --abbrev=0 'HEAD^' 2>$null
            if ($LASTEXITCODE -eq 0) {
              $prev = (git describe --tags --abbrev=0 'HEAD^').Trim()
            }
            if ($prev) {
              $lines = git log "$prev..HEAD" --no-merges --pretty=format:'- %s (%h)'
            }
            else {
              $lines = git log --no-merges --pretty=format:'- %s (%h)'
            }
            $changes = ($lines -join "`n")
            if ([string]::IsNullOrWhiteSpace($changes)) {
              $changes = 'No user-facing changes recorded.'
            }
          }

          $prerelease = 'false'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:MANUAL_PRERELEASE -eq 'true') {
            $prerelease = 'true'
          }
          if ($env:EVENT_NAME -ne 'workflow_dispatch' -and $version -match '(?i)(rc|beta|alpha|pre)') {
            $prerelease = 'true'
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'changes<<CHANGES_EOF'
          Add-Content -Path $env:GITHUB_OUTPUT -Value $changes
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'CHANGES_EOF'

          Write-Output "version=$version prerelease=$prerelease"
          Write-Output '--- changes ---'
          Write-Output $changes

      - name: Build minimal release package
        id: package
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_CHANGES: ${{ steps.meta.outputs.changes }}
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'codex-monitor-release'
          .\tools\package_release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Changes $env:RELEASE_CHANGES `
            -OutputDirectory $outputDirectory

          $versionText = $env:RELEASE_VERSION.Trim()
          if ($versionText.StartsWith('v')) { $versionText = $versionText.Substring(1) }
          $tag = "v$versionText"
          $packageName = "CodexDowngradedMonitor-$tag-windows-amd64"
          $packageZip = Join-Path $outputDirectory "$packageName.zip"
          $releaseNotes = Join-Path $outputDirectory "$packageName-release-notes.md"

          if (!(Test-Path -LiteralPath $packageZip)) { throw "Package was not created: $packageZip" }
          if (!(Test-Path -LiteralPath $releaseNotes)) { throw "Release notes were not created: $releaseNotes" }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_name=$packageName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "package_zip=$packageZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_notes=$releaseNotes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_zip }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          PACKAGE_ZIP: ${{ steps.package.outputs.package_zip }}
          RELEASE_NOTES: ${{ steps.package.outputs.release_notes }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG, $env:PACKAGE_ZIP,
            '--target', $env:GITHUB_SHA,
            '--title', "CodexDowngradedMonitor $env:RELEASE_TAG",
            '--notes-file', $env:RELEASE_NOTES
          )
          if ($env:PRERELEASE -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
