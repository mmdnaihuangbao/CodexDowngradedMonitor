[package]
name = "codex-downgraded-monitor"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[[bin]]
name = "CodexDowngradedMonitor"
path = "src/main.rs"

[[bin]]
name = "monitor-fixture"
path = "src/tests/fixture_process.rs"
required-features = ["test-tools"]

[features]
test-tools = []

[dependencies]
anyhow = "=1.0.100"
memchr = "=2.8.3"
axum = "=0.8.6"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
regex = "=1.12.2"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "signal"] }
tokio-stream = { version = "=0.1.17", features = ["sync"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
